<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#020617">
  <title>Loudreader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { color-scheme: dark; }
    #reader { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; }
    #reader p { font-size: 1.25rem; line-height: 2.0; margin: 0 0 1.1rem; color: #cbd5e1; cursor: pointer; }
    #reader .w { border-radius: 4px; padding: 0 1px; cursor: pointer; transition: background-color .08s linear, color .08s linear; }
    #reader .w:hover { background: #334155; }
    #reader .w.sen { background: #1e293b; }
    #reader .w.on { background: #fde68a; color: #111827; box-shadow: 0 0 0 2px #fde68a; }
    #bar { box-shadow: 0 -4px 20px rgba(0,0,0,.45); }
    body { padding-bottom: 150px; }
    .ctl { width: 2.5rem; height: 2.5rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="bg-slate-900 border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <a href="/" class="font-semibold">&#128266; Loudreader</a>
      <div class="flex items-center gap-3 text-sm">
        <span id="chapInfo" class="text-xs text-slate-500"></span>
        <button id="chapBtn" type="button" class="text-slate-400 underline">Contents</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
    <div class="flex items-baseline justify-between gap-3 mb-1">
      <h1 id="bookTitle" class="text-xl font-semibold text-slate-100 truncate">Loading&hellip;</h1>
      <span id="bookMeta" class="text-xs text-slate-500 shrink-0"></span>
    </div>
    <div id="chapterLabel" class="text-sm text-slate-500 mb-3"></div>
    <div id="loadError" class="hidden text-red-400 text-sm mb-3"></div>
    <div id="voiceWarn" class="hidden bg-amber-950 border border-amber-800 text-amber-200 text-sm rounded-lg p-3 mb-3"></div>
    <article id="reader" class="bg-slate-900 border border-slate-800 rounded-lg p-6 sm:p-8"></article>
  </main>

  <div id="chap" class="fixed inset-0 z-30 hidden">
    <div class="absolute inset-0 bg-black/60" data-chapclose></div>
    <div class="absolute right-0 top-0 bottom-0 w-96 max-w-full bg-slate-900 shadow-xl overflow-y-auto">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <span class="font-medium">Contents</span>
        <button type="button" data-chapclose class="text-slate-500 hover:text-slate-100">&#10005;</button>
      </div>
      <div id="chapList" class="p-2 text-sm"></div>
    </div>
  </div>

  <div id="bar" class="fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 z-20 hidden">
    <div id="gwrap" class="h-2 bg-slate-800 cursor-pointer" title="Jump anywhere in the book">
      <div id="gbar" class="h-2 bg-amber-500" style="width:0%"></div>
    </div>
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3">
      <div class="flex items-center gap-2 text-xs text-slate-500 mb-2">
        <span id="cur" class="tabular-nums">0m</span>
        <input id="seek" type="range" min="0" max="1000" value="0" class="flex-1 accent-amber-500">
        <span id="dur" class="tabular-nums"></span>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <div id="barCover" class="w-10 h-14 rounded overflow-hidden bg-slate-800 hidden sm:block shrink-0"></div>
        <div class="min-w-0 flex-1">
          <div id="barTitle" class="text-sm font-medium text-slate-100 truncate"></div>
          <div id="barSub" class="text-xs text-slate-500 truncate"></div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="prevChap" type="button" class="ctl text-slate-400 hover:bg-slate-800" title="Previous chapter">&#9198;</button>
          <button id="prevSen" type="button" class="ctl border border-slate-700 text-slate-300 hover:bg-slate-800 text-[11px] font-medium" title="Previous sentence">&#8249;s</button>
          <button id="playBtn" type="button" class="w-12 h-12 rounded-full bg-slate-100 text-slate-950 flex items-center justify-center hover:bg-white" aria-label="Play or pause">
            <span id="playIcon" class="text-xl leading-none">&#9654;</span>
          </button>
          <button id="nextSen" type="button" class="ctl border border-slate-700 text-slate-300 hover:bg-slate-800 text-[11px] font-medium" title="Next sentence">s&#8250;</button>
          <button id="nextChap" type="button" class="ctl text-slate-400 hover:bg-slate-800" title="Next chapter">&#9197;</button>
        </div>
        <div class="w-full md:w-auto md:flex-1 min-w-0 flex flex-wrap items-center justify-center md:justify-end gap-2 text-xs">
          <span id="left" class="text-slate-500 truncate"></span>
          <select id="voiceSel" class="border border-slate-800 rounded p-1.5 bg-slate-900 max-w-[11rem]"></select>
          <select id="rate" class="border border-slate-800 rounded p-1.5 bg-slate-900">
            <option value="0.75">0.75&times;</option>
            <option value="1" selected>1&times;</option>
            <option value="1.1">1.1&times;</option>
            <option value="1.25">1.25&times;</option>
            <option value="1.5">1.5&times;</option>
            <option value="1.75">1.75&times;</option>
            <option value="2">2&times;</option>
            <option value="2.5">2.5&times;</option>
            <option value="3">3&times;</option>
            <option value="3.5">3.5&times;</option>
            <option value="4">4&times;</option>
            <option value="5">5&times;</option>
            <option value="6">6&times;</option>
            <option value="8">8&times;</option>
          </select>
          <select id="sleep" class="border border-slate-800 rounded p-1.5 bg-slate-900" title="Sleep timer">
            <option value="0">Sleep: off</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60">60 min</option>
            <option value="end">End of chapter</option>
          </select>
        </div>
      </div>
    </div>
  </div>

<script>
  // Reader engine, chunk-free. The whole book arrives as one text and is
  // rendered as plain paragraphs (browsers handle megabytes of text fine);
  // only the paragraph being read is exploded into word spans, so highlight
  // DOM cost stays constant no matter the book size. Speech goes out as
  // chained utterances of a few sentences (~10s of audio each: long enough to
  // amortize per-utterance engine startup at high rates, short enough to dodge
  // Chrome's long-utterance cutoff); word boundary events drive the highlight;
  // chainSeq gates every callback because engines
  // can double-fire end/error events, which would otherwise fork two
  // interleaved readings.
  const BOOK_ID = location.pathname.split('/').pop();
  const $ = (id) => document.getElementById(id);
  const API = '/api/books/' + BOOK_ID;
  const RATE_KEY = 'lr:rate';
  const VOICE_KEY = 'lr:voice';
  const SPW = 0.42;
  const SENT_END = /[.!?…]["'”’)\]]?$/;

  let book = null;
  let paraTokens = [];   // paraTokens[p] = array of word tokens
  let paraStart = [];    // paraStart[p] = global word index of the para's first token
  let paraEls = [];      // paraEls[p] = <p> element
  let sentences = [];    // {para, off, len, start} - never cross paragraphs
  let N = 0;             // total words
  let activePara = -1;   // the one paragraph currently exploded into spans
  let spans = [];        // span elements of the active paragraph, by local index
  let onEl = null;       // span carrying the .on highlight
  let senMarked = [];
  let curWord = 0;
  let speaking = false;
  let lastSave = 0;
  let sleepUntil = 0;
  let sleepAtEnd = false;
  let errStreak = 0;
  let voices = [];
  let currentUtterance = null;
  let chainSeq = 0;

  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function fmtDur(sec) {
    sec = Math.max(0, sec);
    const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    return h ? h + 'h ' + String(m).padStart(2, '0') + 'm' : m + 'm';
  }
  function fail(html) { $('bookTitle').textContent = 'Loudreader'; $('loadError').innerHTML = html; $('loadError').classList.remove('hidden'); }

  // ---------------- voices ----------------
  function rankVoice(v) {
    const n = v.name.toLowerCase();
    if (n.includes('natural') || n.includes('neural') || n.includes('online')) return 4;
    if (n.includes('google')) return 3;
    if (n.includes('microsoft')) return 2;
    if (n.includes('espeak') || n.includes('festival') || n.includes('mbrola')) return 0;
    return 1;
  }
  function loadVoices() {
    if (!window.speechSynthesis) return;
    voices = speechSynthesis.getVoices();
    if (!voices.length) return;
    const saved = localStorage.getItem(VOICE_KEY);
    const en = voices.filter(v => (v.lang || '').toLowerCase().startsWith('en')).sort((a, b) => rankVoice(b) - rankVoice(a));
    const rest = voices.filter(v => !(v.lang || '').toLowerCase().startsWith('en')).sort((a, b) => (a.lang || '').localeCompare(b.lang || ''));
    const sel = $('voiceSel');
    sel.innerHTML = '';
    [...en, ...rest].forEach(v => {
      const o = document.createElement('option');
      o.value = v.voiceURI;
      o.textContent = v.name.replace(/^(Microsoft|Google)\s*/, '') + ' (' + v.lang + ')';
      sel.appendChild(o);
    });
    sel.value = (saved && voices.some(v => v.voiceURI === saved)) ? saved : (en[0] || voices[0]).voiceURI;
  }
  function pickVoice() {
    const uri = $('voiceSel').value;
    return voices.find(v => v.voiceURI === uri) || null;
  }
  if (window.speechSynthesis) {
    loadVoices();
    speechSynthesis.addEventListener('voiceschanged', loadVoices);
  }

  // ---------------- boot ----------------
  (async function init() {
    if (!window.speechSynthesis) {
      $('voiceWarn').textContent = 'This browser has no speech support. Try Chrome, Edge, Safari or Firefox.';
      $('voiceWarn').classList.remove('hidden');
    }
    let mr, tr;
    try { [mr, tr] = await Promise.all([fetch(API), fetch(API + '/text')]); }
    catch (e) { return fail('Could not load this book.'); }
    if (mr.status === 404) return fail('This book is not in your library. <a class="underline" href="/">Back to the library</a>.');
    if (!mr.ok || !tr.ok) return fail('Could not load this book (HTTP ' + (mr.ok ? tr.status : mr.status) + ').');
    book = await mr.json();
    const text = await tr.text();

    document.title = (book.title || 'Loudreader') + ' | Loudreader';
    $('bookTitle').textContent = book.title || 'Book';
    $('barTitle').textContent = book.title || '';
    if (book.cover_url) $('barCover').innerHTML = '<img src="' + esc(book.cover_url) + '" class="w-full h-full object-cover" alt="">';

    build(text);
    if (!N) return fail('This book has no readable text.');
    $('bookMeta').textContent = [book.author, N.toLocaleString() + ' words',
      '~' + fmtDur(N * SPW)].filter(Boolean).join(' · ');
    buildContents();
    $('bar').classList.remove('hidden');

    const rate = parseFloat(localStorage.getItem(RATE_KEY) || '1') || 1;
    $('rate').value = String(rate);

    curWord = Math.min(Math.max(0, book.cur_word || 0), N - 1);
    setWord(curWord, true);
    markSentence(sentenceOfWord(curWord));
    updateGlobal();
  })();

  // ---------------- text -> paragraphs, sentences ----------------
  function build(text) {
    paraTokens = []; paraStart = []; paraEls = []; sentences = []; N = 0;
    const frag = document.createDocumentFragment();
    (text || '').split(/\n\n+/).forEach(par => {
      const toks = par.split(/\s+/).filter(Boolean);
      if (!toks.length) return;
      const p = paraTokens.length;
      paraTokens.push(toks);
      paraStart.push(N);
      let sOff = 0;
      toks.forEach((t, k) => {
        if (SENT_END.test(t) && k + 1 - sOff >= 2) {
          sentences.push({ para: p, off: sOff, len: k + 1 - sOff, start: N + sOff });
          sOff = k + 1;
        }
      });
      if (sOff < toks.length) sentences.push({ para: p, off: sOff, len: toks.length - sOff, start: N + sOff });
      const el = document.createElement('p');
      el.textContent = toks.join(' ');
      el.dataset.p = p;
      frag.appendChild(el);
      paraEls.push(el);
      N += toks.length;
    });
    $('reader').textContent = '';
    $('reader').appendChild(frag);
  }
  function paraOfWord(w) {
    let lo = 0, hi = paraStart.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (paraStart[mid] <= w) lo = mid; else hi = mid - 1; }
    return lo;
  }
  function sentenceOfWord(w) {
    let lo = 0, hi = sentences.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (sentences[mid].start <= w) lo = mid; else hi = mid - 1; }
    return lo;
  }
  function chapterIndexOf(w) {
    let k = -1;
    (book.chapters || []).forEach((c, i) => { if ((c.word || 0) <= w) k = i; });
    return k;
  }

  // ---------------- active paragraph spans ----------------
  function activatePara(p) {
    if (p === activePara) return;
    if (activePara >= 0 && paraEls[activePara]) paraEls[activePara].textContent = paraTokens[activePara].join(' ');
    activePara = p;
    spans = []; onEl = null; senMarked = [];
    const el = paraEls[p];
    if (!el) return;
    const frag = document.createDocumentFragment();
    const base = paraStart[p];
    paraTokens[p].forEach((t, k) => {
      const sp = document.createElement('span');
      sp.className = 'w';
      sp.dataset.i = base + k;
      sp.textContent = t;
      frag.appendChild(sp);
      frag.appendChild(document.createTextNode(' '));
      spans.push(sp);
    });
    el.textContent = '';
    el.appendChild(frag);
  }

  // ---------------- highlight ----------------
  function setWord(w, scroll) {
    w = Math.min(Math.max(0, w), Math.max(0, N - 1));
    curWord = w;
    const p = paraOfWord(w);
    if (p !== activePara) activatePara(p);
    if (onEl) onEl.classList.remove('on');
    onEl = spans[w - paraStart[p]] || null;
    if (!onEl) return;
    onEl.classList.add('on');
    const rc = onEl.getBoundingClientRect();
    if (scroll || rc.top < 110 || rc.bottom > window.innerHeight - 200) {
      const far = Math.abs(rc.top - window.innerHeight / 2) > window.innerHeight * 2;
      onEl.scrollIntoView({ block: 'center', behavior: far ? 'auto' : 'smooth' });
    }
  }
  function markSentence(si) {
    const s = sentences[si];
    if (!s) return;
    activatePara(s.para);
    senMarked.forEach(el => el.classList.remove('sen'));
    senMarked = [];
    for (let k = s.off; k < s.off + s.len; k++) {
      if (spans[k]) { spans[k].classList.add('sen'); senMarked.push(spans[k]); }
    }
  }

  // ---------------- speech engine ----------------
  // utterance.rate alone cannot express high speeds on Linux: Firefox clamps
  // it to 2.5 and Chromium to 3 before translating to speech-dispatcher's
  // -100..100 rate, so every dial position above ~2.5x collapses into the
  // same saturated value. Our piper speechd wrapper therefore decodes rate
  // as 2.5^(spd/100) and reads the pitch channel (unused, piper has no
  // pitch control) as an extra speed factor 4^(spd_pitch/100). For piper
  // voices we split the wanted speed across both channels, encoded per
  // browser since their spd mappings differ; other voices get plain rate.
  const PIPER_NAME = /^[a-z]{2}_[A-Z]{2}-[A-Za-z0-9_]+-(x_low|low|medium|high)$/;
  const IS_CHROMIUM = navigator.userAgent.includes('Chrome');
  function wantedRate() { return Math.min(8, parseFloat($('rate').value) || 1); }
  function encodeSpeed(u, v) {
    const want = wantedRate();
    if (!(v && PIPER_NAME.test(v.name || ''))) { u.rate = want; return; }
    const base = Math.min(want, 2.5);
    const extra = want / base;
    // spd values Firefox would send for base and extra
    const spdRate = base >= 1 ? 100 * Math.log(base) / Math.log(2.5)
                              : -100 * Math.log(base) / Math.log(0.5);
    const spdPitch = 100 * Math.log(extra) / Math.log(4);
    if (IS_CHROMIUM) {
      // chromium: spd_rate = 100*log3(rate), spd_pitch = 100*log3(pitch)
      u.rate = Math.pow(3, spdRate / 100);
      u.pitch = Math.pow(3, spdPitch / 100);
    } else {
      // firefox: spd_rate = 100*log2.5(rate), spd_pitch = (pitch-1)*100
      u.rate = base;
      u.pitch = 1 + spdPitch / 100;
    }
  }
  function batchEnd(si) {
    // Group consecutive sentences of one paragraph into a single utterance of
    // roughly ~10s of audio at the current rate. Per-utterance engine startup
    // gaps are fixed-cost, so short sentence-sized utterances make high rates
    // feel much slower than advertised.
    const rate = wantedRate();
    const budget = Math.max(24, Math.round(rate * 10 / SPW));
    const p = sentences[si].para;
    let sj = si, words = sentences[si].len;
    while (sj + 1 < sentences.length && sentences[sj + 1].para === p && words + sentences[sj + 1].len <= budget) {
      sj++; words += sentences[sj].len;
    }
    return sj;
  }

  function speakBatch(si, fromTok, chain, attempt) {
    if (chain !== chainSeq || !speaking) return;
    const s = sentences[si];
    if (!s) { onBookDone(); return; }
    markSentence(si);
    fromTok = Math.min(Math.max(0, fromTok || 0), s.len - 1);
    const sj = batchEnd(si);
    const last = sentences[sj];
    const toks = paraTokens[s.para].slice(s.off + fromTok, last.off + last.len);
    const text = toks.join(' ');
    const offs = []; let acc = 0;
    toks.forEach(t => { offs.push(acc); acc += t.length + 1; });
    const W0 = s.start + fromTok;
    let curSi = si;

    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    encodeSpeed(u, v);
    let settled = false;

    setWord(W0);
    u.onboundary = (e) => {
      if (settled || chain !== chainSeq || !e || typeof e.charIndex !== 'number') return;
      let k = 0;
      for (let j = offs.length - 1; j >= 0; j--) if (offs[j] <= e.charIndex) { k = j; break; }
      const w = W0 + k;
      setWord(w);
      const nsi = sentenceOfWord(w);
      if (nsi !== curSi) { curSi = nsi; markSentence(nsi); }
      updateGlobal(); savePos(false);
    };
    u.onend = () => {
      if (settled || chain !== chainSeq) return;
      settled = true;
      errStreak = 0;
      if (!speaking) return;
      advance(sj, chain);
    };
    u.onerror = (e) => {
      if (settled || chain !== chainSeq) return;
      settled = true;
      if ((e && (e.error === 'interrupted' || e.error === 'canceled'))) return;
      if (!attempt && speaking) { setTimeout(() => speakBatch(si, fromTok, chain, 1), 250); return; }
      errStreak++;
      if (errStreak >= 3) {
        pause();
        $('voiceWarn').textContent = 'Speech keeps failing (' + ((e && e.error) || 'unknown')
          + '). Try picking a different voice — quality and reliability vary a lot between browsers.';
        $('voiceWarn').classList.remove('hidden');
        return;
      }
      if (speaking) advance(sj, chain);
    };
    currentUtterance = u;
    speechSynthesis.speak(u);
  }

  function advance(sj, chain) {
    if (sj + 1 >= sentences.length) { onBookDone(); return; }
    if (sleepAtEnd && chapterIndexOf(sentences[sj + 1].start) !== chapterIndexOf(sentences[sj].start)) {
      sleepAtEnd = false; $('sleep').value = '0';
      setWord(sentences[sj + 1].start);
      pause();
      return;
    }
    speakBatch(sj + 1, 0, chain);
  }

  function onBookDone() {
    speaking = false;
    setPlayIcon(false);
    savePosData(Math.max(0, N - 1), true);
    $('chapterLabel').textContent = 'Finished — nicely done.';
  }

  function stopSpeech() {
    chainSeq++;
    currentUtterance = null;
    try { speechSynthesis.cancel(); } catch (e) {}
  }
  function play() {
    if (!window.speechSynthesis || !N) return;
    speaking = true;
    setPlayIcon(true);
    stopSpeech();
    const chain = chainSeq;
    const si = sentenceOfWord(curWord);
    setTimeout(() => { if (speaking && chain === chainSeq) speakBatch(si, curWord - sentences[si].start, chain); }, 60);
  }
  function pause() {
    speaking = false;
    setPlayIcon(false);
    stopSpeech();
    savePos(true);
  }
  function setPlayIcon(p) { $('playIcon').innerHTML = p ? '&#10073;&#10073;' : '&#9654;'; }
  $('playBtn').addEventListener('click', () => { if (speaking) pause(); else play(); });

  // ---------------- navigation ----------------
  function gotoWord(w, keepPlaying) {
    w = Math.min(Math.max(0, w), Math.max(0, N - 1));
    const wasSpeaking = keepPlaying != null ? keepPlaying : speaking;
    stopSpeech();
    speaking = false;
    setWord(w, true);
    markSentence(sentenceOfWord(w));
    savePos(true);
    updateGlobal();
    if (wasSpeaking) play();
  }
  $('prevSen').addEventListener('click', () => {
    const si = sentenceOfWord(curWord);
    const target = (curWord > sentences[si].start + 1 || si === 0) ? si : si - 1;
    gotoWord(sentences[Math.max(0, target)].start);
  });
  $('nextSen').addEventListener('click', () => {
    const si = sentenceOfWord(curWord);
    if (si + 1 < sentences.length) gotoWord(sentences[si + 1].start);
  });
  $('prevChap').addEventListener('click', () => {
    const chs = book.chapters || [];
    let target = null;
    for (const c of chs) if ((c.word || 0) < curWord - 5) target = c.word || 0;
    gotoWord(target != null ? target : Math.max(0, curWord - 1000));
  });
  $('nextChap').addEventListener('click', () => {
    const chs = book.chapters || [];
    const next = chs.find(c => (c.word || 0) > curWord);
    gotoWord(next ? next.word : Math.min(N - 1, curWord + 1000));
  });
  $('seek').addEventListener('input', () => {
    gotoWord(Math.round((+$('seek').value) / 1000 * Math.max(0, N - 1)), false);
  });
  $('gwrap').addEventListener('click', (e) => {
    const rc = $('gwrap').getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - rc.left) / rc.width));
    gotoWord(Math.round(pct * Math.max(0, N - 1)));
  });
  $('reader').addEventListener('click', (e) => {
    const sp = e.target.closest('.w');
    if (sp) { gotoWord(+sp.dataset.i, true); return; }
    const pe = e.target.closest('p');
    if (!pe || pe.dataset.p == null) return;
    const p = +pe.dataset.p;
    // Plain paragraph: locate the clicked word via the caret position.
    let off = 0;
    const pos = document.caretPositionFromPoint ? document.caretPositionFromPoint(e.clientX, e.clientY)
      : (document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null);
    const node = pos && (pos.offsetNode || pos.startContainer);
    if (node && node.nodeType === 3 && pe.contains(node)) off = (pos.offset != null ? pos.offset : pos.startOffset) || 0;
    const toks = paraTokens[p];
    let k = 0, acc = 0;
    for (let j = 0; j < toks.length; j++) { if (off >= acc) k = j; acc += toks[j].length + 1; }
    gotoWord(paraStart[p] + k, true);
  });
  $('rate').addEventListener('change', () => {
    localStorage.setItem(RATE_KEY, $('rate').value);
    if (speaking) play();
    updateGlobal();
  });
  $('voiceSel').addEventListener('change', () => {
    localStorage.setItem(VOICE_KEY, $('voiceSel').value);
    $('voiceWarn').classList.add('hidden');
    errStreak = 0;
    if (speaking) play();
  });
  $('sleep').addEventListener('change', () => {
    const v = $('sleep').value;
    sleepUntil = 0; sleepAtEnd = false;
    if (v === 'end') sleepAtEnd = true;
    else if (+v > 0) sleepUntil = Date.now() + (+v) * 60000;
  });
  document.addEventListener('keydown', (e) => {
    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); $('playBtn').click(); }
    else if (e.code === 'ArrowLeft') $('prevSen').click();
    else if (e.code === 'ArrowRight') $('nextSen').click();
  });

  // ---------------- progress + persistence ----------------
  function updateChapterUI() {
    const chs = book.chapters || [];
    const ci = chapterIndexOf(curWord);
    const c = ci >= 0 ? chs[ci] : null;
    $('chapInfo').textContent = c ? 'Chapter ' + (ci + 1) + ' of ' + chs.length : '';
    $('chapterLabel').textContent = c ? c.title : '';
    $('barSub').textContent = c ? c.title : '';
  }
  function updateGlobal() {
    if (!book || !N) return;
    const total = Math.max(1, N);
    const done = curWord;
    $('gbar').style.width = Math.min(100, done / total * 100) + '%';
    const rate = parseFloat($('rate').value) || 1;
    let leftTxt = '~' + fmtDur((total - done) * SPW / rate) + ' left';
    if (sleepUntil) leftTxt += ' · sleep ' + fmtDur((sleepUntil - Date.now()) / 1000);
    else if (sleepAtEnd) leftTxt += ' · sleep at chapter end';
    $('left').textContent = Math.round(done / total * 100) + '% · ' + leftTxt;
    $('cur').textContent = fmtDur(done * SPW / rate);
    $('dur').textContent = fmtDur(total * SPW / rate);
    $('seek').value = String(Math.round(done / Math.max(1, N - 1) * 1000));
    updateChapterUI();
    if (sleepUntil && Date.now() >= sleepUntil) { sleepUntil = 0; $('sleep').value = '0'; pause(); }
  }
  function savePosData(word, finished, beacon) {
    const opts = {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ word: word || 0, finished: !!finished }),
    };
    if (beacon) opts.keepalive = true;
    fetch(API + '/position', opts).catch(() => {});
  }
  function savePos(force, beacon) {
    const now = Date.now();
    if (!force && now - lastSave < 3000) return;
    lastSave = now;
    savePosData(curWord, false, beacon);
  }
  // Heartbeat: engines without boundary events would otherwise never save
  // while speaking.
  setInterval(() => { if (speaking) { updateGlobal(); savePos(false); } }, 3000);
  window.addEventListener('beforeunload', () => { savePos(true, true); try { speechSynthesis.cancel(); } catch (e) {} });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') savePos(true, true); });

  // ---------------- contents drawer ----------------
  function buildContents() {
    const box = $('chapList');
    const chs = book.chapters || [];
    if (chs.length) {
      box.innerHTML = chs.map(c => {
        const pct = Math.round((c.word || 0) / Math.max(1, N) * 100);
        return '<div class="px-2 py-2 rounded hover:bg-slate-800 cursor-pointer flex justify-between gap-3" data-gotow="' + (c.word || 0) + '">'
          + '<span class="min-w-0 truncate">' + esc(c.title) + '</span>'
          + '<span class="text-xs text-slate-500 shrink-0">' + pct + '%</span></div>';
      }).join('');
    } else {
      box.innerHTML = '<div class="px-2 pb-2 text-xs text-slate-500">No chapters detected — jump by position instead.</div>'
        + '<div class="grid grid-cols-5 gap-1 px-2">'
        + Array.from({ length: 10 }, (_, i) => '<button type="button" class="border border-slate-800 rounded py-1 text-xs hover:bg-slate-800" data-gotow="' + Math.round(i / 10 * N) + '">' + (i * 10) + '%</button>').join('')
        + '</div>';
    }
  }
  $('chapBtn').addEventListener('click', () => $('chap').classList.remove('hidden'));
  $('chap').addEventListener('click', (e) => {
    if (e.target.closest('[data-chapclose]')) { $('chap').classList.add('hidden'); return; }
    const go = e.target.closest('[data-gotow]');
    if (go) { $('chap').classList.add('hidden'); gotoWord(+go.dataset.gotow); }
  });
</script>
</body>
</html>
